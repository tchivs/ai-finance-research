{{ if or .NextInSection .PrevInSection }}
  <nav class="page-nav" aria-label="文档分页">
    {{ with .PrevInSection }}<a href="{{ .RelPermalink }}"><small>上一篇</small><strong>← {{ .Title }}</strong></a>{{ end }}
    {{ with .NextInSection }}<a class="next" href="{{ .RelPermalink }}"><small>下一篇</small><strong>{{ .Title }} →</strong></a>{{ end }}
  </nav>
{{ end }}
